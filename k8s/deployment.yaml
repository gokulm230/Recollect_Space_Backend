apiVersion: apps/v1
kind: Deployment

metadata:
  name: recollect-backend

spec:
  replicas: 1

  selector:
    matchLabels:
      app: recollect-backend

  template:
    metadata:
      labels:
        app: recollect-backend

    spec:
      containers:
        - name: recollect-backend

          image: YOUR_REGION-docker.pkg.dev/YOUR_PROJECT_ID/YOUR_REPOSITORY/recollect-backend:latest

          ports:
            - containerPort: 5000

          envFrom:
            - secretRef:
                name: recollect-backend-secrets

          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"

            limits:
              cpu: "1"
              memory: "1Gi"

          startupProbe:
            tcpSocket:
              port: 5000
            periodSeconds: 10
            failureThreshold: 30

          readinessProbe:
            tcpSocket:
              port: 5000
            periodSeconds: 10
            failureThreshold: 3

          livenessProbe:
            tcpSocket:
              port: 5000
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 3
