apiVersion: v1
kind: Secret
metadata:
  name: recollect-backend-secrets
type: Opaque
stringData:
  MONGO_URI: "replace-with-mongodb-connection-string"
  PORT: "5000"
  JWT_SECRET: "replace-with-a-long-random-jwt-secret"
  EMAIL_USER: "replace-with-smtp-email"
  EMAIL_PASS: "replace-with-smtp-app-password"
  ENCRYPTION_MASTER_KEY: "replace-with-32-character-encryption-key"
  DEBUG_SAVE_FAILED_DECRYPTION: "false"
  CLIENT_ENCRYPTION_KEY: "replace-with-32-character-client-encryption-key"
